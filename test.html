<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>WebGPU 120Hz Stutter Test</title>
		<style>
			body {
				margin: 0;
				padding: 20px;
				background: #1a1a1a;
				color: #fff;
				font-family: monospace;
			}
			canvas {
				border: 1px solid #444;
				display: block;
				margin: 20px 0;
			}
			#info {
				position: fixed;
				top: 10px;
				right: 10px;
				background: rgba(0, 0, 0, 0.8);
				padding: 10px;
				border-radius: 4px;
			}
		</style>
	</head>
	<body>
		<h1>WebGPU 120Hz Stutter Test</h1>
		<p>Pan by clicking and dragging. Watch for stuttering.</p>
		<canvas id="canvas" width="1200" height="800"></canvas>
		<div id="info">
			<div>FPS: <span id="fps">0</span></div>
			<div>Frame Time: <span id="frameTime">0</span>ms</div>
			<div>Offset: <span id="offset">0</span></div>
		</div>

		<script type="module">
			const canvas = document.getElementById('canvas');

			// WebGPU setup
			const adapter = await navigator.gpu.requestAdapter();
			if (!adapter) {
				document.body.innerHTML = '<h1>WebGPU not supported</h1>';
				throw new Error('WebGPU not supported');
			}

			const device = await adapter.requestDevice();
			const context = canvas.getContext('webgpu');
			const format = navigator.gpu.getPreferredCanvasFormat();

			context.configure({
				device,
				format,
				alphaMode: 'premultiplied'
			});

			// FIXED shader - proper vertex/instance separation
			const shaderCode = `
            struct Uniforms {
                offset: f32,
                scale: f32,
                _pad0: f32,
                _pad1: f32,
            };
            
            @group(0) @binding(0) var<uniform> uniforms: Uniforms;
            
            struct VertexOutput {
                @builtin(position) position: vec4f,
                @location(0) color: vec3f,
            };
            
            @vertex
            fn vertexMain(
                @builtin(vertex_index) vertexIndex: u32,
                @builtin(instance_index) instanceIndex: u32
            ) -> VertexOutput {
                // Create a quad (2 triangles = 6 vertices)
                let vertices = array<vec2f, 6>(
                    vec2f(-0.02, -0.02),
                    vec2f( 0.02, -0.02),
                    vec2f( 0.02,  0.02),
                    vec2f(-0.02, -0.02),
                    vec2f( 0.02,  0.02),
                    vec2f(-0.02,  0.02),
                );
                
                // Grid layout
                let gridSize = 30u;
                let x = f32(instanceIndex % gridSize);
                let y = f32(instanceIndex / gridSize);
                
                // Apply offset (panning)
                let vertexPos = vertices[vertexIndex];
                let instancePos = vec2f(
                    (x / f32(gridSize - 1u) - 0.5) * 1.8 + uniforms.offset,
                    (y / f32(gridSize - 1u) - 0.5) * 1.8
                );
                
                var output: VertexOutput;
                output.position = vec4f(instancePos + vertexPos, 0.0, 1.0);
                
                // Color based on position
                output.color = vec3f(
                    x / f32(gridSize),
                    y / f32(gridSize),
                    0.6
                );
                
                return output;
            }
            
            @fragment
            fn fragmentMain(input: VertexOutput) -> @location(0) vec4f {
                return vec4f(input.color, 1.0);
            }
        `;

			// Create shader module and pipeline
			const shaderModule = device.createShaderModule({ code: shaderCode });

			const pipeline = device.createRenderPipeline({
				layout: 'auto',
				vertex: {
					module: shaderModule,
					entryPoint: 'vertexMain'
				},
				fragment: {
					module: shaderModule,
					entryPoint: 'fragmentMain',
					targets: [{ format }]
				},
				primitive: {
					topology: 'triangle-list'
				}
			});

			// Create uniform buffer
			const uniformBuffer = device.createBuffer({
				size: 16,
				usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
			});

			const bindGroup = device.createBindGroup({
				layout: pipeline.getBindGroupLayout(0),
				entries: [
					{
						binding: 0,
						resource: { buffer: uniformBuffer }
					}
				]
			});

			// Animation state
			let offset = 0;
			let isDragging = false;
			let lastX = 0;

			// Mouse handling
			canvas.addEventListener('mousedown', (e) => {
				isDragging = true;
				lastX = e.clientX;
			});

			canvas.addEventListener('mousemove', (e) => {
				if (isDragging) {
					const dx = (e.clientX - lastX) / canvas.width;
					offset += dx * 2;
					lastX = e.clientX;
				}
			});

			canvas.addEventListener('mouseup', () => {
				isDragging = false;
			});

			canvas.addEventListener('mouseleave', () => {
				isDragging = false;
			});

			// Performance tracking
			let lastFrameTime = 0;
			let frameTimes = [];
			let frameCount = 0;
			let lastFpsUpdate = performance.now();

			let previousFrame = null;

			// Main render loop
			async function render(currentTime) {
				if (previousFrame) {
					await previousFrame;
				}

				const frameStart = performance.now();

				// Track frame timing
				if (lastFrameTime > 0) {
					const delta = frameStart - lastFrameTime;
					frameTimes.push(delta);
					if (frameTimes.length > 120) frameTimes.shift();
				}
				lastFrameTime = frameStart;

				// Update uniforms
				const uniformData = new Float32Array([offset, 1.0, 0, 0]);
				device.queue.writeBuffer(uniformBuffer, 0, uniformData);

				// Render
				const commandEncoder = device.createCommandEncoder();

				const textureView = context.getCurrentTexture().createView();

				const renderPass = commandEncoder.beginRenderPass({
					colorAttachments: [
						{
							view: textureView,
							loadOp: 'clear',
							clearValue: { r: 0.1, g: 0.1, b: 0.15, a: 1.0 },
							storeOp: 'store'
						}
					]
				});

				renderPass.setPipeline(pipeline);
				renderPass.setBindGroup(0, bindGroup);
				renderPass.draw(6, 900); // 6 vertices, 900 instances (30x30 grid)
				renderPass.end();

				device.queue.submit([commandEncoder.finish()]);
				previousFrame = device.queue.onSubmittedWorkDone();

				// Update UI
				frameCount++;
				const now = performance.now();
				if (now - lastFpsUpdate > 1000) {
					const avgFrameTime = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
					const fps = 1000 / avgFrameTime;
					document.getElementById('fps').textContent = fps.toFixed(1);
					document.getElementById('frameTime').textContent = avgFrameTime.toFixed(2);
					document.getElementById('offset').textContent = offset.toFixed(3);

					// Log if stuttering detected
					const maxFrameTime = Math.max(...frameTimes);
					if (maxFrameTime > 12) {
						console.warn(`⚠️ Stutter: ${maxFrameTime.toFixed(2)}ms frame`);
					}

					frameCount = 0;
					lastFpsUpdate = now;
				}

				requestAnimationFrame(render);
			}

			// Start the render loop
			requestAnimationFrame(render);

			console.log('✅ WebGPU test started');
			console.log('📊 You should see a 30x30 grid of colored squares');
			console.log('🖱️  Click and drag to pan horizontally');
			console.log('⏱️  Expected: ~8.33ms per frame at 120Hz');
		</script>
	</body>
</html>
