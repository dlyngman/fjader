[project]
name = "fjader"
version = "0.2.0"
description = "An experimental, declarative charting library for Svelte and Python that queries DuckDB and renders with WebGPU"
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["narwhals>=1.0"]

[project.urls]
Repository = "https://github.com/dlyngman/fjader"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]
jupyter = ["anywidget>=0.9"]
streamlit = ["streamlit>=1.0", "pyarrow>=14.0", "duckdb>=1.0"]
pyarrow = ["pyarrow>=14.0"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = [
    "fjader/static/**",
    "fjader/streamlit_frontend/**",
]

[tool.pytest.ini_options]
testpaths = ["fjader/tests"]
