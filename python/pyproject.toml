[project]
name = "diveplot"
version = "0.1.2"
description = "GPU-accelerated data visualization — Python spec builder"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["narwhals>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]
jupyter = ["anywidget>=0.9"]
streamlit = ["streamlit>=1.0", "pyarrow>=14.0"]
pyarrow = ["pyarrow>=14.0"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = [
    "diveplot/static/**",
    "diveplot/streamlit_frontend/**",
]

[tool.pytest.ini_options]
testpaths = ["diveplot/tests"]
